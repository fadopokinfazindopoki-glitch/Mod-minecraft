name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o zip do mod
        run: unzip -q *.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Build
        working-directory: RealWater
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: realwater-jar
          path: RealWater/build/libs/realwater-1.0.0.jar
